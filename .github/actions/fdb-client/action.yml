name: FoundationDB client
description: >
  Install FoundationDB's client library and headers. A Linux build with cgo
  compiles the fdbkv backend, which links libfdb_c, so every Linux job that
  compiles the whole tree with cgo (vet, lint, tests, CodeQL) needs them.

runs:
  using: composite
  steps:
    - name: Install foundationdb-clients
      shell: bash
      run: |
        set -euo pipefail
        version=7.3.77
        # The release's own digests, so the job installs exactly this package.
        case "$(dpkg --print-architecture)" in
          amd64) arch=amd64 sum=b6c263723009bddbc30b6ae8cf9854340bd35cef14152abb0da8fb5af2b91254 ;;
          arm64) arch=aarch64 sum=b3a5dd972ffd37c1d5dc0c29ffa00e2169bcac62c0186571acced8b006af7cc2 ;;
          *) echo "::error::no foundationdb-clients package for $(dpkg --print-architecture)"; exit 1 ;;
        esac
        deb="$RUNNER_TEMP/foundationdb-clients_${version}-1_${arch}.deb"
        curl -fsSL --retry 5 -o "$deb" \
          "https://github.com/apple/foundationdb/releases/download/${version}/foundationdb-clients_${version}-1_${arch}.deb"
        echo "$sum  $deb" | sha256sum -c -
        sudo dpkg -i "$deb"
